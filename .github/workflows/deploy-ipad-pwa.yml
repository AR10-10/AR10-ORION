name: Deploy iPad Runtime (GitHub Pages)

# ═══════════════════════════════════════════════════════════════════════
# GATE DE SENHA REMOVIDO DO DEPLOY (2026-09-07, ordem direta do Operador:
# "remover password gate temporário e preparar autenticação correta").
#
# HISTÓRICO REAL, registrado de propósito (cada virada teve uma razão):
# Pages -> desligado por privacidade -> Cloudflare Access -> rodar local ->
# Pages religado (31/08) -> BLOQUEADO por este mesmo gate de senha (nenhum
# deploy passou entre 24/08 e 07/09, 4 tentativas seguidas — PRs #17/#18/
# #19/#21 — todas travadas no mesmo passo, VITE_ACCESS_HASH nunca
# cadastrado como secret) -> gate removido aqui.
#
# O gate NUNCA foi segurança real (o próprio access-gate.tsx documentava
# isso: hash inline no bundle publicado, contornável por localStorage) — só
# uma cortina em JavaScript que virou, na prática, o único motivo de o
# painel nunca ter sido republicado por 2 semanas. Removê-lo do build não
# reduz a exposição real: este é um painel READ_ONLY, sem credencial de
# exchange, sem execução de ordem — nada que a cortina protegia de fato.
# Autenticação de verdade (identidade individual, login por e-mail, sessão,
# papéis) é arquitetura futura — ver docs/ACESSO_PRIVADO.md.
#
# O deploy publica direto em GitHub Pages, a partir de `main` (já é a
# origem naturalmente autorizada pelo ambiente — ver Settings > Environments
# > github-pages > Deployment branches).
# ═══════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - main
    paths:
      - 'ipad_runtime/**'
      - '.github/workflows/deploy-ipad-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ramber-ui/ is the source tree for the RAMBER terminal (React/
      # Vite) — the ONLY app served at this repo's root. Its build output
      # (index.html + assets/) is copied into ipad_runtime/ root below and
      # becomes the deployed site; ipad_runtime/index.html itself is never
      # committed (generated fresh on every deploy), same reasoning as
      # node_modules/dist being gitignored — only source is versioned.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ipad_runtime/ramber-ui/package-lock.json

      # Caminho 3 (Robustez — o freio estrutural mais citado nas auditorias
      # desta sessão): suite de testes permanente e versionada
      # (ramber-ui/tests/), agora um portão real — se um teste quebra, o
      # job para aqui e nem build nem deploy rodam. vitest.config.ts é
      # totalmente separado de vite.config.ts: esta etapa nunca toca o
      # pipeline de build de produção.
      - name: Run test suite (Vitest)
        working-directory: ipad_runtime/ramber-ui
        run: |
          npm ci --include=dev
          npm run test

      - name: Build RAMBER UI (React/Vite) and place at ipad_runtime root
        working-directory: ipad_runtime/ramber-ui
        run: |
          npm ci --include=dev
          npm run build
          cp -r dist/. ../
          rm -rf node_modules dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload iPad runtime as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ipad_runtime'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

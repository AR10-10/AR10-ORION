name: Deploy iPad Runtime (GitHub Pages)

on:
  push:
    branches:
      - main
      - claude/eloquent-cannon-qyt86y
    paths:
      - 'ipad_runtime/**'
      - '.github/workflows/deploy-ipad-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cyborgpro-ui/ is the source tree for the Cyborg PRO terminal (React/
      # Vite) — the ONLY app served at this repo's root. Its build output
      # (index.html + assets/) is copied into ipad_runtime/ root below and
      # becomes the deployed site; ipad_runtime/index.html itself is never
      # committed (generated fresh on every deploy), same reasoning as
      # node_modules/dist being gitignored — only source is versioned.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ipad_runtime/cyborgpro-ui/package-lock.json

      - name: Build Cyborg PRO UI (React/Vite) and place at ipad_runtime root
        working-directory: ipad_runtime/cyborgpro-ui
        run: |
          npm ci --include=dev
          npm run build
          cp -r dist/. ../
          rm -rf node_modules dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload iPad runtime as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ipad_runtime'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

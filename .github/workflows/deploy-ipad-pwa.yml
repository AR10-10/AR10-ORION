name: Deploy iPad Runtime (GitHub Pages)

on:
  push:
    branches:
      - main
      - claude/eloquent-cannon-qyt86y
    paths:
      - 'ipad_runtime/**'
      - '.github/workflows/deploy-ipad-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cyborgpro-ui/ is the only part of ipad_runtime/ that needs a build step
      # (Vite/React) — everything else in ipad_runtime/ is precompiled static
      # JS served as-is, unchanged by this job.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ipad_runtime/cyborgpro-ui/package-lock.json

      - name: Build Cyborg PRO UI (React/Vite)
        working-directory: ipad_runtime/cyborgpro-ui
        run: |
          npm ci --include=dev
          npm run build
          rm -rf node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload iPad runtime as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ipad_runtime'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
